      // Ensure title styling persists after Webflow rendering
      function fixTitleAlignment() {
        // First try to use the custom wrapper if it exists
        let titleSection = document.getElementById('newsroom-title-wrapper');
        let h1 = document.getElementById('newsroom-title');
        
        if (titleSection) {

        // ALSO inject title into Webflow's cbmc0x9 section if it's missing
        const webflowSection = document.querySelector('div.w-box.cbmc0x9');
        let webflowTitle = null;
        
        if (webflowSection) {
          // Check if title already exists in the webflow section
          webflowTitle = webflowSection.querySelector('h1.newsroom-title');
          
          if (!webflowTitle) {
            // Create and inject the title
            webflowTitle = document.createElement('h1');
            webflowTitle.id = 'newsroom-title-webflow';
            webflowTitle.className = 'newsroom-title';
            webflowTitle.textContent = 'Newsroom';
            webflowTitle.style.cssText = `

            webflowTitle.style.cssText = webflowTitle.style.cssText + `
              display: block !important;
              visibility: visible !important;
              opacity: 1 !important;
            `;
          }
        }

        // Remove any extra duplicate Newsroom headings created by Webflow
        document.querySelectorAll('h1').forEach((node) => {
          if ((node !== h1 && node !== webflowTitle) && node.textContent.trim() === 'Newsroom') {
            node.remove();

      // Run immediately and after load
      fixTitleAlignment();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fixTitleAlignment);
      }
      window.addEventListener('load', fixTitleAlignment);
      
      // Watch for DOM changes and reapply the title styling whenever the wrapper changes

    <script>
      async function loadNewsroom() {
        // Try multiple CSV URL formats for better compatibility
        const csvUrls = [
          'https://docs.google.com/spreadsheets/d/e/2PACX-1vSq730VlKoVv7wgUkEzlR1CuIJVg8WrNES0AEq2qCIpXxxhhFPqruf6_aAUBD0TfhVjL8vVZhXLqWyJ/pub?output=csv',

        ];
        
        // Create an isolated container if it doesn't exist
        // Use a selector that exists: find the containing div with the Newsroom heading
        let pillWrapper = document.getElementById('news-pills-root');
        if (!pillWrapper) {
          pillWrapper = document.createElement('div');
          pillWrapper.id = 'news-pills-root';
          pillWrapper.setAttribute('data-webflow-processed', 'true');
          pillWrapper.style.cssText = `
            max-width: 800px;
            margin: 40px auto;
            padding: 0 24px;
            min-height: 100px;
            display: block !important;
            visibility: visible !important;
            overflow: visible !important;
            position: relative !important;
          `;
          
          // Find the Newsroom heading section and insert after it
          const newsroomSection = document.querySelector('div.w-box.cbmc0x9');
          if (newsroomSection && newsroomSection.nextElementSibling) {
            // Insert right after the Newsroom heading section
            newsroomSection.parentNode.insertBefore(pillWrapper, newsroomSection.nextElementSibling);
            console.log('Created isolated root container for pills after Newsroom heading');
          } else {
            // Fallback: insert after news-feed div if it exists
            const newsFeed = document.getElementById('news-feed');
            if (newsFeed && newsFeed.nextElementSibling) {
              newsFeed.parentNode.insertBefore(pillWrapper, newsFeed.nextElementSibling);
              console.log('Created isolated root container for pills after news-feed div');
            } else if (document.body) {
              // Last resort: append to body
              document.body.appendChild(pillWrapper);
              console.log('Created isolated root container for pills at body end');
            } else {
              console.warn('Body element not found');
              return;
            }
          }
        }

        // Show loading state in wrapper
        pillWrapper.textContent = '';
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'news-unavailable';
        loadingDiv.textContent = 'Loading news...';
        pillWrapper.appendChild(loadingDiv);

        let csvText = null;

        // Try each URL format until one works
        for (const sheetURL of csvUrls) {
          try {
            console.log('Attempting to fetch:', sheetURL);
            const response = await fetch(sheetURL, {
              method: 'GET',
              headers: {
                'Accept': 'text/csv,text/plain,*/*'
              }
            });
            
            if (!response.ok) {
              console.warn(`Failed with status ${response.status}, trying next URL...`);
              continue;
            }

            csvText = await response.text();
            console.log('✓ Successfully fetched CSV');
            break;
          } catch (e) {
            console.warn(`Failed to fetch ${sheetURL}:`, e.message);
          }
        }

        if (!csvText) {
          console.error('Failed to fetch from all CSV URLs');
          pillWrapper.textContent = '';
          const errorDiv = document.createElement('div');
          errorDiv.className = 'news-unavailable';
          errorDiv.textContent = 'Unable to load news data. Please check your internet connection or try again later.';
          pillWrapper.appendChild(errorDiv);
          return;
        }

        try {
          console.log('CSV Data received, length:', csvText.length);
          
          // Parse CSV properly (handles quoted cells with newlines/commas)
          const rows = parseCSV(csvText);
          
          console.log('Total rows (including header):', rows.length);
          if (rows.length > 0) {
            console.log('Header row:', rows[0].join(' | '));
          }
          
          // Skip header row
          const dataRows = rows.slice(1);
          console.log('Data rows (excluding header):', dataRows.length);

          if (dataRows.length === 0) {
            console.log('No data rows found - spreadsheet may be empty');
            pillWrapper.textContent = '';
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'news-unavailable';
            emptyDiv.textContent = 'No articles available currently.';
            pillWrapper.appendChild(emptyDiv);
            return;
          }

          let pillsCreated = 0;

          // Clear loading state
          pillWrapper.textContent = '';

          // Process each row
          dataRows.forEach((cols, index) => {
            if (!cols || cols.length === 0) {
              console.log(`Row ${index}: empty`);
              return;
            }

            console.log(`Row ${index}: ${cols.length} columns`);
            
            // Ensure we have at least title and date
            if (cols.length < 2) {
              console.log(`Row ${index}: insufficient columns (${cols.length})`);
              return;
            }

            const title = cols[0] ? cols[0].trim() : '';
            const date = cols[1] ? cols[1].trim() : '';
            const image = cols.length > 2 ? (cols[2] ? cols[2].trim() : '') : '';
            const body = cols.length > 3 ? (cols[3] ? cols[3].trim() : '') : '';

            if (!title) {
              console.log(`Row ${index}: empty title`);
              return;
            }

            console.log(`Row ${index}: ✓ Creating pill for "${title}" (${date})`);

            // Create pill container with INLINE styles to bypass CSS conflicts
            const pill = document.createElement('div');
            pill.setAttribute('role', 'button');
            pill.setAttribute('tabindex', '0');
            // Mark as not-webflow-interactive to prevent Webflow framework processing
            pill.setAttribute('data-w-dynamic', 'skip');
            pill.setAttribute('data-webflow-processed', 'true');
            
            // Apply inline styles directly - cannot be overridden by external CSS
            pill.style.cssText = `
              border: 2px solid transparent;
              border-radius: 50px;
              background-image: linear-gradient(black, black), linear-gradient(180deg, #FFFFFF 54.17%, #B372CF 100%);
              background-origin: border-box;

              display: flex !important;
              flex-direction: column;
              justify-content: flex-start;
              align-items: stretch;
              visibility: visible !important;
              opacity: 1 !important;
              width: 100%;
              box-sizing: border-box;
            `;
            // Don't use className since we're using inline styles for full control
            // pill.className = 'news-pill';

            // Create header
            const header = document.createElement('div');
            header.style.cssText = `
              display: flex !important;
              justify-content: space-between;
              align-items: center;
              gap: 12px;
              font-family: 'Inter', sans-serif;
              flex-shrink: 0;
              min-height: 24px;
              visibility: visible !important;
              opacity: 1 !important;
            `;
            // Don't use className since we're using inline styles for full control
            // header.className = 'pill-header';

            const titleSpan = document.createElement('span');
            titleSpan.style.cssText = `
              font-weight: 600;
              font-size: 16px;
              white-space: normal;
              overflow: visible;
              text-overflow: clip;
              flex: 1;
              visibility: visible !important;
              opacity: 1 !important;
              color: white;
            `;
            titleSpan.textContent = title;
            header.appendChild(titleSpan);

            const dateSmall = document.createElement('small');
            dateSmall.style.cssText = `
              opacity: 0.7;
              font-size: 13px;
              white-space: nowrap;
              flex-shrink: 0;
              visibility: visible !important;
              color: white;
            `;
            dateSmall.textContent = date;
            header.appendChild(dateSmall);

            pill.appendChild(header);

            // Create content area
            const content = document.createElement('div');
            content.style.cssText = `
              display: none;
              margin-top: 16px;
              white-space: pre-line;
              word-wrap: break-word;
              font-family: 'Inter', sans-serif;
              font-size: 14px;
              line-height: 1.6;
              width: 100%;
              visibility: visible !important;
              opacity: 1 !important;
              color: white;
            `;
            // Don't use className since we're using inline styles for full control
            // content.className = 'pill-content';

            // Add image if present
            if (image) {
              const img = document.createElement('img');
              img.style.cssText = `
                max-width: 100%;
                height: auto;
                border-radius: 8px;
                margin-bottom: 12px;
                display: block;
              `;
              // Don't use className since we're using inline styles for full control
              // img.className = 'pill-img';
              img.alt = 'News image';
              img.src = image;
              img.onerror = function() { this.style.display = 'none'; };
              content.appendChild(img);
            }

            // Add body text if present
            if (body) {
              const bodyDiv = document.createElement('div');
              bodyDiv.style.cssText = `
                visibility: visible !important;
                opacity: 1 !important;
              `;
              bodyDiv.textContent = body;
              content.appendChild(bodyDiv);
            }

            pill.appendChild(content);

            // Toggle expanded state on click or Enter key (use inline styles)
            const toggleExpanded = () => {
              const isExpanded = content.style.display && content.style.display !== 'none';
              if (isExpanded) {
                content.style.display = 'none';
                pill.style.height = '55px';
                pill.style.borderRadius = '50px';
                pill.style.padding = '16px 20px';
                pill.setAttribute('aria-expanded', 'false');
              } else {
                content.style.display = 'block';
                pill.style.height = 'auto';
                pill.style.borderRadius = '20px';
                pill.style.padding = '24px';
                pill.setAttribute('aria-expanded', 'true');
              }
            };
            pill.addEventListener('click', toggleExpanded);
            pill.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleExpanded();
              }
            });

            pillWrapper.appendChild(pill);
            pillsCreated++;
            
            // Force reflow to ensure pill is rendered
            try {
              pill.offsetHeight; // Trigger reflow
            } catch (e) {
              console.warn('Reflow trigger failed:', e);
            }
            
            // Debug: Log computed styles for first pill
            if (pillsCreated === 1) {
              setTimeout(() => {
                const computed = window.getComputedStyle(pill);
                console.log('First pill computed styles:');
                console.log('  display:', computed.display);
                console.log('  visibility:', computed.visibility);
                console.log('  opacity:', computed.opacity);
                console.log('  height:', computed.height);
                console.log('  width:', computed.width);
                console.log('  overflow:', computed.overflow);
                console.log('  Pill element:', pill);
                console.log('  Pill in DOM:', document.body.contains(pill));
              }, 100);
            }
          });

          console.log(`✓ Successfully created ${pillsCreated} news pills`);
          console.log('Wrapper children count:', pillWrapper.children.length);
          
          // Force visibility of all pills
          if (pillsCreated > 0) {
            pillWrapper.style.display = 'block';
            pillWrapper.style.visibility = 'visible';
            pillWrapper.style.opacity = '1';
            Array.from(pillWrapper.children).forEach((pill) => {
              pill.style.display = 'flex';
              pill.style.visibility = 'visible';
              pill.style.opacity = '1';
            });
            console.log('Forced visibility on all pills and container');

            // Check visibility after 500ms
            setTimeout(() => {
              const wrapperInDom = document.body.contains(pillWrapper);

              if (!wrapperInDom) {
                console.warn('Root container was removed! Re-creating...');
                loadNewsroom();
                return;
              }
              
              const childrenVisible = Array.from(pillWrapper.children).some(child => {
                const computed = window.getComputedStyle(child);
                return computed.display !== 'none' && computed.visibility !== 'hidden' && computed.opacity !== '0';
              });
              
              if (!childrenVisible && pillsCreated > 0) {
                console.warn('Pills not visible, showing text fallback');
                pillWrapper.textContent = '';
                const header = document.createElement('div');
                header.style.cssText = 'padding: 20px; color: white; text-align: center; font-family: Inter, sans-serif;';
                header.textContent = 'News Feed:';
                pillWrapper.appendChild(header);
                
                dataRows.forEach((cols, i) => {
                  const title = cols[0] ? cols[0].trim() : 'Untitled';
                  const date = cols[1] ? cols[1].trim() : 'Unknown date';
                  const text = cols[3] ? cols[3].trim() : 'No content';

                  fallback.textContent = `${title}\n${date}\n\n${text}`;
                  pillWrapper.appendChild(fallback);

                console.log('Text fallback created');
              } else if (childrenVisible) {
                console.log('Pills are visible!');

          if (pillWrapper.children.length === 0) {

            pillWrapper.textContent = '';

            noValidDiv.className = 'news-unavailable';
            noValidDiv.textContent = 'No valid articles found.';
            pillWrapper.appendChild(noValidDiv);
          }

        } catch (error) {
          console.error('Newsroom Error:', error);
          console.error('Error stack:', error.stack);
          if (pillWrapper) {
            pillWrapper.textContent = '';
            const errorDiv = document.createElement('div');
            errorDiv.className = 'news-unavailable';
            errorDiv.textContent = 'News currently unavailable. Please try again later.';
            pillWrapper.appendChild(errorDiv);
          }
        }
      }

      // Robust CSV parser that handles quoted cells with newlines and commas
      function parseCSV(csvText) {
        const rows = [];
        let currentRow = [];
        let currentCell = '';
        let insideQuotes = false;
        
        for (let i = 0; i < csvText.length; i++) {
          const char = csvText[i];
          const nextChar = csvText[i + 1];
          
          if (char === '"') {
            if (insideQuotes && nextChar === '"') {
              // Escaped quote
              currentCell += '"';
              i++; // Skip the next quote
            } else {
              // Toggle quoted state
              insideQuotes = !insideQuotes;
            }
          } else if (char === ',' && !insideQuotes) {
            // End of cell
            currentRow.push(currentCell);
            currentCell = '';
          } else if ((char === '\n' || char === '\r') && !insideQuotes) {
            // End of row
            if (currentCell || currentRow.length > 0) {
              currentRow.push(currentCell);
              if (currentRow.some(cell => cell.trim())) {
                rows.push(currentRow);
              }
              currentRow = [];
              currentCell = '';
            }
            // Skip \r\n combo
            if (char === '\r' && nextChar === '\n') {
              i++;
            }
          } else {
            currentCell += char;
          }
        }
        
        // Add last cell and row
        if (currentCell || currentRow.length > 0) {
          currentRow.push(currentCell);
        }
        if (currentRow.some(cell => cell.trim())) {
          rows.push(currentRow);
        }
        
        return rows;
      }

      // Helper function to escape HTML special characters
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Run after full window load to avoid being overwritten by hydration frameworks
      console.log('=== Newsroom Script Loaded ===');
      console.log('Document readyState:', document.readyState);
      window.__newsroomReran = window.__newsroomReran || false;
      window.__newsroomStarted = window.__newsroomStarted || false;

      function startNewsroomWhenSafe() {
        if (window.__newsroomStarted) return;
        
        // Remove framework-injected "No articles available" text
        try {
          const textElements = document.querySelectorAll('.w-text');
          textElements.forEach(el => {
            if (el.textContent.includes('No articles available') || el.textContent.includes('Last updated')) {
              el.style.display = 'none';
            }
          });
        } catch (e) {
          console.log('Could not remove articles text:', e.message);
        }
        
        // Prefer to run after full load so frameworks finish DOM replacements
        if (document.readyState === 'complete') {
          window.__newsroomStarted = true;
          console.log('Document fully loaded, calling loadNewsroom now');
          loadNewsroom();
        } else {
          console.log('Waiting for window.load before loading newsroom');
          window.addEventListener('load', () => {
            if (window.__newsroomStarted) return;
            window.__newsroomStarted = true;
            
            // Remove framework-injected text
            try {
              const textElements = document.querySelectorAll('.w-text');
              textElements.forEach(el => {
                if (el.textContent.includes('No articles available') || el.textContent.includes('Last updated')) {
                  el.style.display = 'none';
                }
              });
            } catch (e) {
              console.log('Could not remove articles text:', e.message);
            }
            
            console.log('window.load fired');
            loadNewsroom();
          }, { once: true });

          // Fallback: if load doesn't fire within 2s, call once
          setTimeout(() => {
            if (!window.__newsroomStarted) {
              window.__newsroomStarted = true;
              console.log('Fallback: calling loadNewsroom after timeout');
              loadNewsroom();
            }
          }, 2000);
        }
      }

      startNewsroomWhenSafe();
    </script>
